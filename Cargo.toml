[package]
name = "count-files"
version = "0.1.0"
edition = "2021"
description = "Count files in a directory tree with flexible grouping (Rust port of count_files.py)"

[[bin]]
name = "count-files"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
